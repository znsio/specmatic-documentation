version: 3
dependencies:
  services:
    - service:
        definitions:
          - definition:
              source:
                filesystem: {}
              specs:
                - spec:
                    id: ping
                    path: asyncapi.yaml
        runOptions:
          asyncapi:
            type: mock
            inMemoryBroker:
              host: localhost
              port: 19092
            servers:
              - server:
                  host: localhost:19092
                  protocol: kafka
                  type: in-memory
