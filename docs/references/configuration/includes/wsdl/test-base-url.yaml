version: 3
systemUnderTest:
  service:
    definitions:
      - definition:
          source:
            filesystem:
              directory: '{SOAP_SPEC_DIRECTORY:.}'
          specs:
            - hello.wsdl
    data:
      examples:
        - directories:
            - soap-examples
    runOptions:
      wsdl:
        type: test
        baseUrl: http://127.0.0.1:9100
        host: 127.0.0.1
        port: 9102
specmatic:
  settings:
    test:
      junitReportDir: reports
