version: 3
systemUnderTest:
  service:
    definitions:
      - definition:
          source:
            filesystem:
              directory: '{SOAP_SPEC_DIRECTORY:.}'
          specs:
            - spec:
                id: greeting
                path: hello.wsdl
    data:
      examples:
        - directories:
            - soap-examples
    runOptions:
      wsdl:
        type: test
        host: 127.0.0.1
        port: 9100
        specs:
          - spec:
              id: greeting
              baseUrl: http://127.0.0.1:9102
specmatic:
  settings:
    test:
      junitReportDir: reports
