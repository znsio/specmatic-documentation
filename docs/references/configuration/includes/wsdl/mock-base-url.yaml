version: 3
dependencies:
  settings:
    hotReload: false
  services:
    - service:
        definitions:
          - definition:
              source:
                filesystem:
                  directory: '{SOAP_SPEC_DIRECTORY:.}'
              specs:
                - hello.wsdl
        data:
          examples:
            - directories:
                - soap-examples
        runOptions:
          wsdl:
            type: mock
            baseUrl: http://127.0.0.1:9101
            host: 127.0.0.1
            port: 9102
