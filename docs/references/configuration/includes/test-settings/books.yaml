openapi: 3.0.3
info:
  title: Books API
  version: '1.0'
paths:
  /books/{id}:
    get:
      operationId: getBook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          examples:
            handbook:
              value: 1
            second:
              value: 2
      responses:
        '200':
          description: A book
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - title
                properties:
                  id:
                    type: integer
                  title:
                    type: string
              examples:
                handbook:
                  value:
                    id: 1
                    title: Specmatic Handbook
                second:
                  value:
                    id: 2
                    title: Second Book
